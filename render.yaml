services:
  # ---------------------------------------------------------------------------
  # NestJS REST API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: erp-pos-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-pos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: erp-pos-redis
          property: connectionString
      - key: API_PORT
        value: 4000
      - key: API_PREFIX
        value: api/v1
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: CSRF_ENABLED
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "7"
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: "60"
      - key: SUPER_ADMIN_EMAIL
        value: admin@erp.local
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  # ---------------------------------------------------------------------------
  # Redis Cache & Session Store
  # ---------------------------------------------------------------------------
  - type: redis
    name: erp-pos-redis
    plan: starter
    region: oregon
    ipAllowList: []

databases:
  # ---------------------------------------------------------------------------
  # PostgreSQL Managed Database
  # ---------------------------------------------------------------------------
  - name: erp-pos-db
    databaseName: erp_pos
    user: erp
    plan: starter
    region: oregon
